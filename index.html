<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101716" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <title>Unit Converter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

    :root {
      color-scheme: light dark;
      --page: #f4f7f6;
      --surface: #ffffff;
      --surface-raised: #f9fbfa;
      --text: #14201d;
      --muted: #5a6965;
      --line: #ccd7d3;
      --line-strong: #a9b9b4;
      --accent: #087f68;
      --accent-strong: #056753;
      --accent-soft: #dff3ed;
      --accent-text: #035c4a;
      --focus: #f0a424;
      --shadow: 0 16px 40px rgba(18, 50, 42, 0.09);
      --radius-card: 24px;
      --radius-control: 13px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101716;
        --surface: #18211f;
        --surface-raised: #1d2825;
        --text: #edf5f2;
        --muted: #a7b8b3;
        --line: #33423e;
        --line-strong: #52635e;
        --accent: #4ed2b3;
        --accent-strong: #79dfc6;
        --accent-soft: #173c33;
        --accent-text: #8ce7d0;
        --focus: #ffc45b;
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--page);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    button, input, select { font: inherit; }

    button, select { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 34px) 16px max(28px, env(safe-area-inset-bottom));
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 4px 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 2.1rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
      font-weight: 600;
    }

    .intro p {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .intro-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }

    .home-pill {
      flex: none;
      padding: 6px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface);
      color: var(--accent-text);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .home-pill:hover { background: var(--accent-soft); }

    .home-pill:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .category {
      min-width: 0;
      min-height: 46px;
      padding: 0 7px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      font-size: clamp(0.73rem, 2.8vw, 0.9rem);
      cursor: pointer;
    }

    .category[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .category:focus-visible,
    .swap:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .converter {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: clamp(18px, 5vw, 30px);
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .value-input {
      width: 100%;
      height: 68px;
      padding: 0 15px;
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius-control);
      background: var(--surface-raised);
      color: var(--text);
      caret-color: var(--accent);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(1.45rem, 7vw, 2rem);
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .value-input::placeholder { color: var(--muted); opacity: 0.65; }

    .unit-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr);
      align-items: end;
      gap: 10px;
      margin-top: 18px;
    }

    .select-wrap { min-width: 0; }

    select {
      width: 100%;
      height: 56px;
      padding: 0 36px 0 13px;
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius-control);
      background-color: var(--surface-raised);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
    }

    .swap {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 2px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    .swap:hover { background: var(--accent-strong); }
    .swap:active { transform: rotate(12deg); }

    @media (prefers-color-scheme: dark) {
      .swap { color: #06271f; }
    }

    .swap svg { width: 24px; height: 24px; }

    .result {
      margin-top: 22px;
      padding: 20px 18px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .result-title {
      margin: 0 0 5px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    output {
      display: block;
      overflow-wrap: anywhere;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(1.3rem, 5.8vw, 2rem);
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }

    .precision-note {
      min-height: 22px;
      margin: 13px 3px 0;
      color: var(--muted);
      font-size: 0.83rem;
      text-align: center;
    }

    @media (max-width: 510px) {
      .intro p { display: none; }
      .categories {
        grid-template-columns: repeat(3, 1fr);
      }
      .category:nth-child(4), .category:nth-child(5) {
        grid-column: span 1;
      }
      .category:nth-child(4) { grid-column-start: 1; }
      .category:nth-child(5) { grid-column: 2 / span 1; }
    }

    @media (max-width: 390px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .converter { padding: 16px; }
      .unit-row {
        grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr);
        gap: 7px;
      }
      .swap { width: 46px; height: 46px; margin-bottom: 5px; }
      select { padding-left: 9px; padding-right: 26px; font-size: 0.92rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="intro">
      <h1>Convert a measurement</h1>
      <div class="intro-meta">
        <p>Instant, accurate conversions</p>
        <a class="home-pill" href="https://jesuslovestyler.com/">⌂ Home</a>
      </div>
    </div>

    <div class="categories" role="tablist" aria-label="Measurement category">
      <button class="category" type="button" role="tab" aria-selected="false" data-category="length">Length</button>
      <button class="category" type="button" role="tab" aria-selected="false" data-category="weight">Weight</button>
      <button class="category" type="button" role="tab" aria-selected="true" data-category="volume">Volume</button>
      <button class="category" type="button" role="tab" aria-selected="false" data-category="temperature">Temp</button>
      <button class="category" type="button" role="tab" aria-selected="false" data-category="area">Area</button>
    </div>

    <section class="converter" aria-label="Unit converter">
      <label class="field-label" for="amount">Value</label>
      <input class="value-input" id="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="410" aria-describedby="precision-note" />

      <div class="unit-row">
        <div class="select-wrap">
          <label class="field-label" for="from-unit">From</label>
          <select id="from-unit" aria-label="Convert from"></select>
        </div>

        <button class="swap" id="swap" type="button" aria-label="Swap units" title="Swap units">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3" />
          </svg>
        </button>

        <div class="select-wrap">
          <label class="field-label" for="to-unit">To</label>
          <select id="to-unit" aria-label="Convert to"></select>
        </div>
      </div>

      <div class="result" aria-live="polite" aria-atomic="true">
        <p class="result-title">Result</p>
        <output id="result" for="amount from-unit to-unit">410 gal = 1,552.02 L</output>
      </div>

      <p class="precision-note" id="precision-note">Volume uses U.S. customary measurements.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var categories = {
        length: {
          note: "",
          defaultFrom: "ft",
          defaultTo: "m",
          units: [
            { id: "in", name: "Inches", short: "in", factor: 0.0254 },
            { id: "ft", name: "Feet", short: "ft", factor: 0.3048 },
            { id: "yd", name: "Yards", short: "yd", factor: 0.9144 },
            { id: "mi", name: "Miles", short: "mi", factor: 1609.344 },
            { id: "mm", name: "Millimeters", short: "mm", factor: 0.001 },
            { id: "cm", name: "Centimeters", short: "cm", factor: 0.01 },
            { id: "m", name: "Meters", short: "m", factor: 1 },
            { id: "km", name: "Kilometers", short: "km", factor: 1000 }
          ]
        },
        weight: {
          note: "",
          defaultFrom: "lb",
          defaultTo: "kg",
          units: [
            { id: "oz", name: "Ounces", short: "oz", factor: 28.349523125 },
            { id: "lb", name: "Pounds", short: "lb", factor: 453.59237 },
            { id: "g", name: "Grams", short: "g", factor: 1 },
            { id: "kg", name: "Kilograms", short: "kg", factor: 1000 }
          ]
        },
        volume: {
          note: "Volume uses U.S. customary measurements.",
          defaultFrom: "gal",
          defaultTo: "l",
          units: [
            { id: "tsp", name: "Teaspoons", short: "tsp", factor: 4.92892159375 },
            { id: "tbsp", name: "Tablespoons", short: "tbsp", factor: 14.78676478125 },
            { id: "cup", name: "Cups", short: "cup", factor: 236.5882365 },
            { id: "pt", name: "Pints", short: "pt", factor: 473.176473 },
            { id: "qt", name: "Quarts", short: "qt", factor: 946.352946 },
            { id: "gal", name: "Gallons", short: "gal", factor: 3785.411784 },
            { id: "ml", name: "Milliliters", short: "mL", factor: 1 },
            { id: "l", name: "Liters", short: "L", factor: 1000 }
          ]
        },
        temperature: {
          note: "",
          defaultFrom: "f",
          defaultTo: "c",
          units: [
            { id: "f", name: "Fahrenheit", short: "°F" },
            { id: "c", name: "Celsius", short: "°C" },
            { id: "k", name: "Kelvin", short: "K" }
          ]
        },
        area: {
          note: "",
          defaultFrom: "sqft",
          defaultTo: "sqm",
          units: [
            { id: "sqft", name: "Square feet", short: "ft²", factor: 0.09290304 },
            { id: "sqm", name: "Square meters", short: "m²", factor: 1 },
            { id: "acre", name: "Acres", short: "ac", factor: 4046.8564224 }
          ]
        }
      };

      var state = { category: "volume" };
      var amount = document.getElementById("amount");
      var fromSelect = document.getElementById("from-unit");
      var toSelect = document.getElementById("to-unit");
      var result = document.getElementById("result");
      var note = document.getElementById("precision-note");
      var swap = document.getElementById("swap");
      var tabs = Array.prototype.slice.call(document.querySelectorAll(".category"));

      function findUnit(id) {
        var units = categories[state.category].units;
        for (var i = 0; i < units.length; i += 1) {
          if (units[i].id === id) return units[i];
        }
        return units[0];
      }

      function formatNumber(value) {
        if (!isFinite(value)) return "—";
        if (value === 0) return "0";
        var abs = Math.abs(value);
        if (abs >= 1000000000 || abs < 0.000001) {
          return value.toExponential(5).replace(/\.0+e/, "e").replace(/(\.\d*?)0+e/, "$1e");
        }
        var leading = Math.floor(Math.log(abs) / Math.LN10);
        var decimals = Math.max(0, Math.min(10, 5 - leading));
        var rounded = Number(value.toFixed(decimals));
        return rounded.toLocaleString(undefined, { maximumFractionDigits: decimals });
      }

      function parseAmount(raw) {
        var normalized = raw.trim().replace(/,/g, "");
        if (normalized === "" || normalized === "-" || normalized === "." || normalized === "-.") return null;
        var value = Number(normalized);
        return isFinite(value) ? value : null;
      }

      function convertTemperature(value, from, to) {
        var celsius;
        if (from === "c") celsius = value;
        else if (from === "f") celsius = (value - 32) * 5 / 9;
        else celsius = value - 273.15;

        if (to === "c") return celsius;
        if (to === "f") return celsius * 9 / 5 + 32;
        return celsius + 273.15;
      }

      function updateResult() {
        var inputValue = parseAmount(amount.value);
        var from = findUnit(fromSelect.value);
        var to = findUnit(toSelect.value);

        if (inputValue === null) {
          result.textContent = "Enter a number to convert";
          return;
        }

        var converted;
        if (state.category === "temperature") {
          converted = convertTemperature(inputValue, from.id, to.id);
        } else {
          converted = inputValue * from.factor / to.factor;
        }
        result.textContent = formatNumber(inputValue) + " " + from.short + " = " + formatNumber(converted) + " " + to.short;
      }

      function fillSelect(select, units, selectedId) {
        select.innerHTML = "";
        units.forEach(function (unit) {
          var option = document.createElement("option");
          option.value = unit.id;
          option.textContent = unit.name;
          option.selected = unit.id === selectedId;
          select.appendChild(option);
        });
      }

      function setCategory(categoryId) {
        state.category = categoryId;
        var category = categories[categoryId];
        fillSelect(fromSelect, category.units, category.defaultFrom);
        fillSelect(toSelect, category.units, category.defaultTo);
        note.textContent = category.note || "Accurate to six significant digits.";
        tabs.forEach(function (tab) {
          tab.setAttribute("aria-selected", String(tab.getAttribute("data-category") === categoryId));
        });
        updateResult();
      }

      tabs.forEach(function (tab, index) {
        tab.addEventListener("click", function () {
          setCategory(tab.getAttribute("data-category"));
        });
        tab.addEventListener("keydown", function (event) {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          var next = event.key === "ArrowRight" ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
          tabs[next].focus();
          setCategory(tabs[next].getAttribute("data-category"));
        });
      });

      amount.addEventListener("input", updateResult);
      fromSelect.addEventListener("change", updateResult);
      toSelect.addEventListener("change", updateResult);
      swap.addEventListener("click", function () {
        var oldFrom = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = oldFrom;
        updateResult();
        amount.focus();
      });

      setCategory("volume");
    }());
  </script>
  <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
